<!doctype html>
<!-- BOTÃO "SAIBA MAIS" COM CURSOR CLICANDO (layer: front): botão estilo anúncio entra, o cursor chega e clica
     (botão afunda, onda de clique). params: text ("Saiba Mais"), sub (linha menor opcional), accent, color (texto),
     click_at (s), y (px do centro; default 0,68*H) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css"><link rel="stylesheet" href="/lib/scene.css">
<style>
  #b { position: absolute; left: 50%; padding: 34px 90px; white-space: nowrap; border-radius: 28px; font-weight: 900; font-size: 64px;
       display: flex; flex-direction: column; align-items: center; box-shadow: 0 24px 60px rgba(0,0,0,.4), inset 0 -8px 0 rgba(0,0,0,.18); }
  #sub { font-size: 30px; font-weight: 700; opacity: .8; margin-top: 4px; }
</style></head>
<body><div id="b"><div id="txt"></div><div id="sub"></div></div>
<script type="module">
import motion from '/lib/runtime.js';
import { cursor } from '/lib/fx.js';
const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;
const b = document.getElementById('b');
b.style.background = p.accent || '#1877F2'; b.style.color = p.color || '#fff';
document.getElementById('txt').textContent = p.text || 'Saiba Mais';
const sub = document.getElementById('sub'); sub.textContent = p.sub || ''; if (!p.sub) sub.style.display = 'none';
const cy = p.y ?? H * 0.68, clickAt = p.click_at ?? Math.min(1.4, D - 0.6);
const cur = cursor(document.body);
motion.onFrame((t) => {
  const k = motion.inOut(t, 0, D, 0.45, 0.3, 'outBack');
  const press = t >= clickAt && t < clickAt + 0.18 ? 0.92 : 1;
  b.style.top = cy + 'px';
  b.style.transform = `translate(-50%, -50%) scale(${k * press})`;
  b.style.opacity = k > 0.01 ? 1 : 0;
  const r = b.getBoundingClientRect();
  cur(t, [{ at: clickAt - 0.9, x: W * 0.85, y: cy + 380 }, { at: clickAt, x: r.left + r.width * 0.62, y: r.top + r.height * 0.6, click: true }]);
});
</script></body></html>
