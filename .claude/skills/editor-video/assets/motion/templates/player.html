<!doctype html>
<!-- PLAYER (layer: front): janela de vídeo no topo, no estilo de player (cabeçalho com ícone de play e título,
     selo à direita, barra de progresso e tempo embaixo) com o vídeo do produto tocando dentro. Desce do topo e
     fica acima da cabeça da pessoa.
     params: items: [{video: "tela.mp4", start: 0}] (ou [{image: "print.png"}]), titulo, selo ("100% EDITADA COM IA"),
             total ("3:01": duração exibida; padrão a do trecho), legenda (texto em baixo, opcional), accent,
             y (topo, padrão 230), altura (padrão 600) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<style>
  #win { position: absolute; left: 40px; right: 150px; border-radius: 26px; overflow: hidden;
         background: rgba(12,10,22,.92); border: 2px solid rgba(190,170,255,.55); box-shadow: var(--sh-float), inset 0 1px 0 rgba(255,255,255,.2); }
  #head { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; gap: 14px;
          padding: 0 22px; background: linear-gradient(180deg, rgba(10,8,20,.95), rgba(10,8,20,.6)); z-index: 2; }
  #play { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  #play:after { content: ''; margin-left: 5px; border-left: 15px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  #title { font-weight: 800; font-size: 30px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #selo { font-weight: 800; font-size: 19px; letter-spacing: 2px; padding: 8px 14px; border-radius: 999px; color: #fff; white-space: nowrap; }
  #media { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  #media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #foot { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding: 0 22px; z-index: 2;
          background: linear-gradient(0deg, rgba(10,8,20,.9), rgba(10,8,20,0)); }
  #leg { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-family: 'Anton'; font-size: 40px;
         color: #fff; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,.6); z-index: 2; }
  #bar { position: absolute; left: 22px; right: 22px; bottom: 44px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
  #fill { height: 100%; border-radius: 3px; }
  #time { position: absolute; left: 22px; bottom: 10px; font-weight: 700; font-size: 20px; color: rgba(255,255,255,.85); }
</style></head>
<body><div id="win"><div id="media"><img id="img"></div>
  <div id="head"><div id="play"></div><div id="title"></div><div id="selo"></div></div>
  <div id="leg"></div><div id="foot"><div id="bar"><div id="fill"></div></div><div id="time"></div></div></div>
<script type="module">
import motion from '/lib/runtime.js';
const p = motion.params, D = motion.duration;
const accent = p.accent || '#7C5CFF';
const win = document.getElementById('win'), img = document.getElementById('img');
win.style.top = (p.y || 230) + 'px'; win.style.height = (p.altura || 600) + 'px';
document.getElementById('play').style.background = accent;
document.getElementById('title').textContent = p.titulo || '';
const selo = document.getElementById('selo');
if (p.selo) { selo.textContent = p.selo; selo.style.background = accent; } else selo.style.display = 'none';
document.getElementById('fill').style.background = '#fff';
document.getElementById('leg').textContent = p.legenda || '';
const it = (p.items || [])[0] || {};
const fps = motion.fps, count = it.count || 1;
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const toSec = (s) => { const [m, ss] = String(s).split(':').map(Number); return m * 60 + (ss || 0); };
const total = p.total ? toSec(p.total) : Math.max(count / fps, D);
const start = Number(it.start || 0);
if (it.image) motion.waitFor(new Promise((r) => { img.onload = r; img.onerror = r; img.src = it.image; }));
motion.onFrame(async (t) => {
  motion.appear(win, t, 0, { from: 'down', dist: 140, scale0: 0.86, rot0: -2, dur: 0.65, bounce: 0.24, t1: D, blur: 18, float: 3 });
  const pl = document.getElementById('play');
  pl.style.transform = `scale(${motion.pop(t, 0.35, 0.45, 0.55)})`;
  if (it.frames) {
    const i = motion.clamp(Math.round(t * fps), 0, count - 1) + 1;
    const src = it.frames.replace('%05d', String(i).padStart(5, '0'));
    if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; await img.decode().catch(() => {}); }
  } else img.style.transform = `scale(${1.03 + 0.05 * t / D})`;
  const now = start + t;
  document.getElementById('fill').style.width = (100 * motion.clamp(now / total)) + '%';
  document.getElementById('time').textContent = `${mmss(now)} / ${mmss(total)}`;
});
</script></body></html>
