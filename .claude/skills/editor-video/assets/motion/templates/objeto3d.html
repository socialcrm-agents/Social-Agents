<!doctype html>
<!-- OBJETO 3D (layer: front ou behind, webgl): texto extrudado ou logo (imagem) em placa 3D com espessura,
     brilho e reflexo. Entra girando, flutua e pode SEGUIR A MÃO (hand: true no plano).
     Com layer "behind" fica atrás da pessoa (o compositor recoloca a pessoa por cima).
     params: text | image (arquivo PNG/JPG/SVG do usuário), color, metal (0..1), x, y (0..1, posição quando não
             segue a mão), size (altura em fração da tela, default .16), follow ("hand"), offset ([dx, dy] da mão),
             spin (voltas na entrada), at (s) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.min.js"}}</script>
<style>canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { TTFLoader } from '/vendor/three/addons/TTFLoader.js';
import { Font } from '/vendor/three/addons/FontLoader.js';
import { TextGeometry } from '/vendor/three/addons/TextGeometry.js';
import { RoomEnvironment } from '/vendor/three/addons/RoomEnvironment.js';
import motion from '/lib/runtime.js';
const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(0.75);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// reflexos de estúdio (ambiente procedural do three.js, sem imagem externa)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
// câmera ortográfica em "pixels de tela": fica fácil posicionar onde a mão está
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -4000, 4000);
cam.position.z = 1500;
scene.add(new THREE.HemisphereLight('#ffffff', '#334', 2.2));
const key = new THREE.DirectionalLight('#ffffff', 3.2); key.position.set(-400, 600, 900); scene.add(key);
const rim = new THREE.DirectionalLight(p.rim || '#7cc8ff', 2.4); rim.position.set(600, -200, -500); scene.add(rim);

const color = new THREE.Color(p.color || '#FFE600');
const height = (p.size || 0.16) * H;
const group = new THREE.Group(); scene.add(group);
const mat = new THREE.MeshStandardMaterial({ color, metalness: p.metal ?? 0.55, roughness: 0.22 });
const side = new THREE.MeshStandardMaterial({ color: color.clone().multiplyScalar(0.55), metalness: 0.5, roughness: 0.35 });

async function build() {
  if (p.image) {
    const tex = await new THREE.TextureLoader().loadAsync(p.image);
    tex.colorSpace = THREE.SRGBColorSpace;
    const ar = tex.image.width / tex.image.height;
    const w = height * ar, h = height, d = height * 0.16, r = Math.min(w, h) * 0.18;
    const shape = new THREE.Shape();
    shape.moveTo(-w / 2 + r, -h / 2); shape.lineTo(w / 2 - r, -h / 2); shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
    shape.lineTo(w / 2, h / 2 - r); shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); shape.lineTo(-w / 2 + r, h / 2);
    shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); shape.lineTo(-w / 2, -h / 2 + r); shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelSize: d * 0.25, bevelThickness: d * 0.25, bevelSegments: 4 }),
      [new THREE.MeshStandardMaterial({ color: p.plate || '#ffffff', metalness: 0.2, roughness: 0.3 }), side]);
    body.position.z = -d / 2; group.add(body);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.86, h * 0.86), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    face.position.z = d / 2 + d * 0.3; group.add(face);
  } else {
    const json = await new TTFLoader().loadAsync('/fonts/' + (p.font || 'Anton-Regular.ttf'));
    const geo = new TextGeometry(String(p.text || 'IA').toUpperCase(), { font: new Font(json), size: height * 0.8, depth: height * 0.22,
      curveSegments: 6, bevelEnabled: true, bevelThickness: height * 0.03, bevelSize: height * 0.02, bevelSegments: 3 });
    geo.computeBoundingBox(); geo.center();
    group.add(new THREE.Mesh(geo, [mat, side]));
  }
}
motion.waitFor(build());

const hand = p.hand || [];
const at = p.at ?? 0;
let last = null;
function target(t) {
  const i = Math.min(hand.length - 1, Math.max(0, Math.round(t * motion.fps)));
  const hp = p.follow === 'hand' && hand.length ? hand[i] : null;
  const off = p.offset || [0, -0.09];
  let pos = hp ? [hp[0] + off[0], hp[1] + off[1]] : [p.x ?? 0.5, p.y ?? 0.24];
  if (!hp && last) pos = last;              // mão sumiu: fica onde estava
  if (hp) last = pos;
  return [(pos[0] - 0.5) * W, (0.5 - pos[1]) * H];
}

motion.onFrame((t) => {
  const kin = motion.prog(t, at, 0.7, 'outBack');
  const kout = motion.prog(t, D - 0.35, 0.35, 'inQuad');
  const s = Math.max(kin * (1 - kout), 0.0001);
  const [x, y] = target(t);
  group.position.set(x, y + Math.sin(t * 2.2) * 10, 0);
  group.scale.setScalar(s);
  const spin = (p.spin ?? 1) * Math.PI * 2 * (1 - motion.prog(t, at, 1.0, 'outCubic'));
  group.rotation.set(Math.sin(t * 1.3) * 0.12, spin + Math.sin(t * 1.1) * 0.35, Math.sin(t * 0.9) * 0.05);
  renderer.render(scene, cam);
});
</script></body></html>
