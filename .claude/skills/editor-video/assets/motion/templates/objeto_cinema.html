<!doctype html>
<!-- OBJETO DE CINEMA (layer: front, webgl): QUALQUER OBJETO em 3D de verdade, no tempo da palavra.
     O objeto vem da BIBLIOTECA (assets/motion/objetos/<nome>.js, que cresce a cada objeto novo que a IA modela —
     ver scripts/objetos.py) e este template cuida de tudo em volta: tamanho, posição, luz de estúdio, reflexo,
     sombra no chão, brilho, entrada animada, flutuação, vista explodida e saída.
     params: objeto (nome ou sinônimo: "sofá", "lápis", "moedas", "cérebro"...), modelo (caminho de um .js fora da
             biblioteca), at (s ou palavra), x, y (0..1 do centro; padrão 0.5, 0.36), size (fração da altura; 0.30),
             cor (destaque/brilho), entrada ("monta" peça por peça | "cai" | "gira" | "voa" | "surge"; padrão: o do
             objeto), explodir (true: as peças se separam e voltam), explodir_at (s depois da entrada; 1.2),
             angulo ([rx, ry] em radianos), giro (voltas por segundo; padrão balanço suave), sombra (true),
             brilho (0..1; 0.8) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.min.js"}}</script>
<style>canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '/vendor/three/addons/RoomEnvironment.js';
import motion from '/lib/runtime.js';
import k from '/lib/objetos.js';

const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;
const { clamp, lerp, ease } = motion;
const AT = p.at ?? 0;
const BRILHO = p.brilho ?? 0.8;
const slug = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = p.sombra !== false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const FOV = 30, DIST = 10;
const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 100);
cam.position.set(0, 0, DIST);
const visH = 2 * DIST * Math.tan(THREE.MathUtils.degToRad(FOV / 2)), visW = visH * W / H;
scene.add(new THREE.HemisphereLight('#ffffff', '#30283a', 0.6));
const key = new THREE.DirectionalLight('#fff1e0', 2.2); key.position.set(-3, 5, 5);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005; scene.add(key);
const rim = new THREE.DirectionalLight('#bfe0ff', 2.6); rim.position.set(4, 2, -4); scene.add(rim);

// onde o objeto fica na tela e com que tamanho
const raiz = new THREE.Group();
raiz.position.set(((p.x ?? 0.5) - 0.5) * visW, (0.5 - (p.y ?? 0.36)) * visH, 0);
const ESC = (p.size ?? 0.30) * visH;
raiz.scale.setScalar(ESC);
scene.add(raiz);
key.target = raiz;
const sh = key.shadow.camera; sh.left = sh.bottom = -ESC * 1.2; sh.right = sh.top = ESC * 1.2;

let obj = null, info = {}, pecas = [], halo = null, chao = null, propria = null, extra = null;

async function carregar() {
  let url = p.modelo;
  if (!url) {
    const nome = slug(p.objeto || 'moedas');
    let arquivo = nome;
    try {   // índice com os sinônimos (gerado por scripts/objetos.py)
      const ind = await (await fetch('/objetos/indice.json')).json();
      arquivo = ind[nome] || nome;
    } catch (e) { /* sem índice: usa o nome direto */ }
    url = `/objetos/${arquivo}.js`;
  }
  const mod = await import(url);
  info = mod.info || {};
  k.cor = new THREE.Color(p.cor || info.cor || '#FFC83D');
  k.brilho = BRILHO;
  k.spring = (t, t0, o) => motion.spring(t, t0, o);
  k.ease = ease;
  k.params = p;
  k.semente(7);
  obj = mod.default(THREE, k);
  propria = obj.userData.animar || null;                          // animação própria (com entrada própria)
  if (mod.animar) extra = (s, t) => mod.animar(obj, k, s, t);      // complemento depois da entrada padrão
  // normaliza: maior medida = 1 unidade, centro na origem (o modelador não precisa pensar em escala)
  obj.updateMatrixWorld(true);
  const caixa = new THREE.Box3().setFromObject(obj, true), tam = caixa.getSize(new THREE.Vector3());
  const s = 1 / Math.max(tam.y, tam.x * 0.85, tam.z * 0.85, 1e-6);
  const centro = caixa.getCenter(new THREE.Vector3());
  const pivo = new THREE.Group(), ajuste = new THREE.Group();
  ajuste.position.copy(centro).negate();      // o objeto fica livre para animar a própria posição
  ajuste.add(obj); pivo.add(ajuste); pivo.scale.setScalar(s);
  const giro = new THREE.Group(); giro.add(pivo);
  const ang = p.angulo || info.angulo || [0.28, -0.55];
  giro.rotation.set(ang[0], ang[1], 0);
  giro.userData.base = ang;
  raiz.add(giro);
  raiz.userData.giro = giro;
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  // chão invisível que só recebe a sombra (o objeto "pousa" na cena)
  if (p.sombra !== false && info.sombra !== false) {
    chao = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.28 }));
    chao.rotation.x = -Math.PI / 2; chao.position.y = -0.52; chao.receiveShadow = true; raiz.add(chao);
  }
  if (!propria) { halo = k.halo(k.cor, 2.0); halo.position.z = -0.4; raiz.add(halo); }
  // peças = filhos diretos do objeto (o que monta e explode)
  const c0 = new THREE.Vector3();
  pecas = obj.children.filter((c) => !c.userData.halo).map((c, i) => {
    const cw = new THREE.Box3().setFromObject(c, true).getCenter(new THREE.Vector3()).sub(c0);
    const dir = cw.lengthSq() > 1e-6 ? cw.normalize() : new THREE.Vector3(Math.sin(i * 2.4), 0.6, Math.cos(i * 2.4)).normalize();
    return { c, pos: c.position.clone(), rot: c.rotation.clone(), esc: c.scale.clone(), dir, i,
             giro: new THREE.Vector3((k.rnd() - 0.5) * 3, (k.rnd() - 0.5) * 3, (k.rnd() - 0.5) * 3) };
  });
}
motion.waitFor(carregar());

function entradaGenerica(s) {
  const modo = p.entrada || info.entrada || 'monta', n = pecas.length;
  let geral = 1;
  if (modo === 'monta') {
    const passo = Math.min(0.09, 1.0 / Math.max(n, 1));
    for (const pc of pecas) {
      const q = k.spring(s, pc.i * passo, { dur: 0.55, bounce: 0.28 });
      const d = (1 - q) * 1.6;
      pc.c.position.set(pc.pos.x + pc.dir.x * d, pc.pos.y + pc.dir.y * d + (1 - q) * 0.8, pc.pos.z + pc.dir.z * d);
      pc.c.rotation.set(pc.rot.x + pc.giro.x * (1 - q), pc.rot.y + pc.giro.y * (1 - q), pc.rot.z + pc.giro.z * (1 - q));
      pc.c.visible = s >= pc.i * passo;
    }
    geral = clamp(s / (n * passo + 0.4));
  } else {
    const q = k.spring(s, 0, { dur: modo === 'cai' ? 0.7 : 0.6, bounce: modo === 'cai' ? 0.45 : 0.3 });
    const g = raiz.userData.giro;
    if (modo === 'cai') { g.position.y = (1 - q) * 1.8; }
    else if (modo === 'voa') { g.position.set((1 - q) * -2.2, Math.sin(q * Math.PI) * 0.4, 0); g.rotation.z = (1 - q) * 1.2; }
    else if (modo === 'gira') { g.scale.setScalar(Math.max(q, 1e-3)); g.rotation.y += (1 - q) * 6; }
    else { g.scale.setScalar(Math.max(q, 1e-3)); }
    geral = q;
  }
  return geral;
}

function explosao(s) {
  if (!p.explodir || !pecas.length) return;
  const t0 = p.explodir_at ?? 1.2, meio = Math.max((D - AT) - t0 - 0.9, 0.6) / 2;
  const kx = Math.max(0, k.spring(s, t0, { dur: 0.8, bounce: 0.15 }) - k.spring(s, t0 + meio + 0.4, { dur: 0.7, bounce: 0.2 }));
  for (const pc of pecas) pc.c.position.addScaledVector(pc.dir, kx * 0.45);
}

motion.onFrame((t) => {
  if (!obj) return;
  const s = t - AT;
  raiz.visible = s >= 0;
  if (s >= 0) {
    const g = raiz.userData.giro, [ax, ay] = g.userData.base;
    g.rotation.set(ax, p.giro ? ay + t * p.giro * Math.PI * 2 : ay + Math.sin(t * 0.55) * 0.32, 0);
    g.position.set(0, Math.sin(t * 1.3) * 0.015, 0);
    g.scale.setScalar(1);
    let geral = 1;
    if (propria) propria(s, t); else geral = entradaGenerica(s);
    if (extra) extra(s, t);
    explosao(s);
    if (halo) halo.material.opacity = 0.32 * BRILHO * geral;
    if (chao) chao.material.opacity = 0.28 * clamp(geral);
    const sai = motion.exitK(t, D, 0.35);
    raiz.scale.setScalar(ESC * (1 - 0.25 * sai));
    renderer.domElement.style.opacity = String(1 - sai);
  }
  renderer.render(scene, cam);
});
</script></body></html>
