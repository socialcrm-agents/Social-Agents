<!doctype html>
<!-- PERGUNTA (layer: front): card claro no topo, estilo caixinha de pergunta, com o texto entrando palavra a palavra
     no ritmo da fala (cada palavra surge com desfoque e mola; cursor piscando no fim).
     params: text, label ("PERGUNTA"), ate_at (palavra/instante em que a digitação termina; padrão 75% da duração),
             accent (cor da etiqueta), bg (cor do card), y (topo, padrão 230), icone (Lucide, padrão message-circle) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<style>
  #wrap { position: absolute; left: 46px; right: 156px; transform-origin: 18% 0%; }
  #card { position: relative; padding: 30px 40px 38px; border-radius: 34px; overflow: hidden; }
  #head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  #ico { width: 54px; height: 54px; border-radius: 16px; }
  #label { font-weight: 800; font-size: 25px; letter-spacing: .22em; text-transform: uppercase; }
  #text { font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -1px; color: var(--ink); }
  #text span { display: inline-block; }
  #caret { display: inline-block; width: 6px; height: .92em; margin-left: 6px; vertical-align: -0.12em; border-radius: 3px; }
  #bar { position: absolute; left: 0; bottom: 0; height: 7px; }
</style></head>
<body><div id="wrap"><div id="card" class="ds-card"><div class="ds-sheen" id="sheen"></div>
  <div id="head"><div id="ico" class="ds-ico-badge"></div><div id="label"></div></div>
  <div id="text"></div><div id="bar"></div></div></div>
<script type="module">
import motion from '/lib/runtime.js';
const p = motion.params, D = motion.duration;
const accent = p.accent || '#7C5CFF';
document.documentElement.style.setProperty('--accent', accent);
document.documentElement.style.setProperty('--accent2', p.accent2 || '#C084FC');
const wrap = document.getElementById('wrap'), card = document.getElementById('card'), label = document.getElementById('label');
const text = document.getElementById('text'), bar = document.getElementById('bar'), sheen = document.getElementById('sheen');
wrap.style.top = (p.y || 230) + 'px';
if (p.bg) card.style.background = p.bg;
label.textContent = p.label ?? 'PERGUNTA';
label.style.color = accent;
bar.style.background = `linear-gradient(90deg, ${accent}, var(--accent2))`;
motion.waitFor(motion.icon(p.icone || 'message-circle').then((s) => { document.getElementById('ico').innerHTML = s; }));
const full = String(p.text || '');
const end = typeof p.ate_at === 'number' ? Math.max(p.ate_at, 0.5) : D * 0.75;
const words = motion.split(text, 'words', full);
const caret = document.createElement('span');
caret.id = 'caret'; caret.style.background = accent;
text.appendChild(caret);
// cada palavra entra quando a "digitação" chega nela (proporcional ao número de letras)
const total = full.replace(/\s+/g, '').length || 1;
let acc = 0;
const at = words.map((w) => { const a = 0.25 + (end - 0.25) * (acc / total); acc += w.textContent.length; return a; });
motion.onFrame((t) => {
  const { x } = motion.appear(wrap, t, 0, { from: 'down', dist: 70, scale0: 0.86, dur: 0.6, bounce: 0.28, t1: D, float: 4 });
  words.forEach((w, i) => {
    const k = motion.spring(t, at[i], { dur: 0.35, bounce: 0.3 });
    w.style.opacity = motion.clamp(k * 1.8);
    w.style.transform = `translateY(${(1 - k) * 22}px) scale(${0.85 + 0.15 * k})`;
    w.style.filter = k < 0.98 ? `blur(${(1 - Math.min(k, 1)) * 10}px)` : 'none';
  });
  const typing = t < end;
  caret.style.opacity = typing || Math.floor(t * 2.4) % 2 === 0 ? 1 : 0;
  bar.style.width = (100 * motion.clamp((t - 0.25) / Math.max(end - 0.25, 0.3))) + '%';
  motion.shimmer(sheen, t, 2.8, end);
  sheen.style.opacity = t > end ? 0.9 : 0;
  card.style.boxShadow = '';
  void x;
});
</script></body></html>
