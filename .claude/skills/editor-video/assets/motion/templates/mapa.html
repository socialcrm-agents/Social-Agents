<!doctype html>
<!-- MAPA ILUSTRADO (layer: front com mode "card", ou full): mapa vetorial estilizado (ruas, parque, rio)
     com câmera aproximando, pino do destino, ponto de interesse e rota desenhada com o tempo de deslocamento.
     ATENÇÃO: é ilustrativo (não é cartografia real). Para localização real, use documentario.html com um print
     de mapa autorizado.
     params: place (título), pin_label (rótulo no pino, opcional), poi, poi_icon (Lucide), time_label ("4 min a pé"), accent, mode ("card"|"full"),
             pin_at, route_at (s), seed (muda o desenho das ruas) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<style>
  #card { overflow: hidden; background: #e9edf2; }
  #card.full { inset: 0; border-radius: 0; }
  #map { position: absolute; transform-origin: 0 0; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 800; color: #111;
         background: #fff; padding: 12px 26px; border-radius: 999px; font-size: 38px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .pin { position: absolute; width: 90px; height: 90px; transform: translate(-50%, -100%); }
  .poi { position: absolute; width: 96px; height: 96px; border-radius: 50%; transform: translate(-50%, -50%);
         display: grid; place-items: center; color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .poi .icon { width: 54px; height: 54px; }
  #tag { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 40px; color: #111;
         padding: 12px 28px; border-radius: 18px; white-space: nowrap; }
  #title { position: absolute; left: 50px; top: 46px; font-family: 'DM Serif Display'; font-style: italic;
           font-size: 72px; color: #111; text-shadow: 0 2px 0 #fff; }
</style></head>
<body>
<div id="card" class="abs"><svg id="map" width="2400" height="2400" viewBox="0 0 2400 2400"></svg>
  <div id="overlay" class="abs" style="inset:0"></div><div id="title"></div></div>
<script type="module">
import motion from '/lib/runtime.js';
const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;
const accent = p.accent || '#22E06B';
const card = document.getElementById('card'), svg = document.getElementById('map'), ov = document.getElementById('overlay');
const full = p.mode === 'full';
const cw = full ? W : W * 0.86, ch = full ? H : H * 0.42;
if (full) card.classList.add('full');
else card.style.cssText = `left:${(W - cw) / 2}px;top:${H * 0.17}px;width:${cw}px;height:${ch}px;border-radius:40px;
  border:6px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.45)`;
document.getElementById('title').textContent = p.place || '';

// ruas procedurais (determinísticas pela semente)
let s = p.seed || 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
el('rect', { x: 0, y: 0, width: 2400, height: 2400, fill: '#eef1f5' });
el('path', { d: 'M -50 1700 C 500 1500, 900 1900, 1400 1650 S 2200 1500, 2500 1700', stroke: '#9fd0f5', 'stroke-width': 120, fill: 'none' });
el('ellipse', { cx: 600, cy: 700, rx: 260, ry: 190, fill: '#bfe6c4' });
el('ellipse', { cx: 1900, cy: 520, rx: 200, ry: 150, fill: '#bfe6c4' });
for (let i = 0; i < 18; i++) {
  const y = 80 + i * 130 + rnd() * 40, x = 80 + i * 130 + rnd() * 40, wd = i % 5 === 0 ? 34 : 16;
  el('line', { x1: 0, y1: y, x2: 2400, y2: y + (rnd() - 0.5) * 160, stroke: '#fff', 'stroke-width': wd });
  el('line', { x1: x, y1: 0, x2: x + (rnd() - 0.5) * 160, y2: 2400, stroke: '#fff', 'stroke-width': wd });
}
for (let i = 0; i < 70; i++) el('rect', { x: rnd() * 2300, y: rnd() * 2300, width: 50 + rnd() * 90, height: 50 + rnd() * 90, rx: 8, fill: '#dde2ea' });
const dest = [1250, 1150], poi = [1640, 1380];
const route = el('path', { d: `M ${poi[0]} ${poi[1]} L ${poi[0]} ${dest[1] + 60} L ${dest[0]} ${dest[1] + 60}`, stroke: accent,
  'stroke-width': 18, fill: 'none', 'stroke-linecap': 'round', 'stroke-dasharray': '1 0' });
const len = route.getTotalLength();
route.setAttribute('stroke-dasharray', `${len} ${len}`);

const pin = document.createElement('div'); pin.className = 'pin';
pin.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="${accent}" stroke="#111" stroke-width="1"/><circle cx="12" cy="10" r="3.2" fill="#fff"/></svg>`;
const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = p.pin_label || '';
if (!p.pin_label) lbl.style.display = 'none';
const poiEl = document.createElement('div'); poiEl.className = 'poi'; poiEl.style.background = '#1d4ed8';
poiEl.innerHTML = '<div class="icon"></div>';
const poiLbl = document.createElement('div'); poiLbl.className = 'lbl'; poiLbl.textContent = p.poi || '';
const tag = document.createElement('div'); tag.id = 'tag'; tag.style.background = accent; tag.textContent = p.time_label || '';
ov.append(pin, lbl, poiEl, poiLbl, tag);
motion.waitFor(motion.icon(p.poi_icon || 'train-front').then((x) => { poiEl.querySelector('.icon').innerHTML = x; }));
const pinAt = p.pin_at ?? 0.6, routeAt = p.route_at ?? pinAt + 0.9;

motion.onFrame((t) => {
  const kz = motion.prog(t, 0, Math.min(1.6, D * 0.5), 'inOutCubic');
  const scale = motion.lerp(0.55, 1.15, kz) * (full ? 1.4 : 1);
  const cx = motion.lerp(1200, (dest[0] + poi[0]) / 2, kz), cy = motion.lerp(1200, (dest[1] + poi[1]) / 2, kz);
  const tx = cw / 2 - cx * scale, ty = ch / 2 - cy * scale;
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  const toScreen = ([x, y]) => [tx + x * scale, ty + y * scale];
  const [dx, dy] = toScreen(dest), [px, py] = toScreen(poi);
  const kp = motion.prog(t, pinAt, 0.5, 'outBack');
  pin.style.left = dx + 'px'; pin.style.top = dy - (1 - kp) * 160 + 'px'; pin.style.opacity = Math.min(1, kp * 2);
  lbl.style.left = dx + 'px'; lbl.style.top = dy - 100 + 'px'; lbl.style.opacity = motion.prog(t, pinAt + 0.3, 0.3);
  const kr = motion.prog(t, routeAt, 0.9, 'inOutQuad');
  route.setAttribute('stroke-dashoffset', String(len * (1 - kr)));
  const kq = motion.prog(t, routeAt - 0.2, 0.4, 'outBack');
  poiEl.style.left = px + 'px'; poiEl.style.top = py + 'px'; poiEl.style.transform = `translate(-50%,-50%) scale(${kq})`;
  poiLbl.style.left = px + 'px'; poiLbl.style.top = py + 100 + 'px'; poiLbl.style.opacity = kq; poiLbl.style.transform = 'translate(-50%, 0)';
  const kt = motion.prog(t, routeAt + 0.8, 0.35, 'outBack');
  tag.style.left = (dx + px) / 2 + 'px'; tag.style.top = (dy + py) / 2 + 40 + 'px'; tag.style.transform = `translate(-50%,-50%) scale(${kt})`;
  card.style.opacity = motion.inOut(t, 0, D, 0.3, 0.3);
  if (!full) card.style.transform = `translateY(${(1 - motion.prog(t, 0, 0.45, 'outBack')) * 60}px)`;
});
</script></body></html>
