<!doctype html>
<!-- CHECKLIST DE PROGRESSO (layer: front ou full): itens marcados um a um no tempo da fala, com barra de progresso.
     Ex. da referência: ouvindo cada palavra, cortando pausas, melhor tomada, legenda, zoom, efeito sonoro, trilha.
     params: title, items: [{text, at (s ou palavra falada)}], accent, mode ("card"|"full"), y -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css"><link rel="stylesheet" href="/lib/scene.css">
<style>
  #c { position: absolute; left: 50%; width: 860px; background: #fffdf9; color: #1d1b18; border-radius: 40px; padding: 44px 50px;
       box-shadow: 0 40px 100px rgba(60,40,20,.3); border: 2px solid #e7dfd1; }
  #title { font-family: 'DM Serif Display'; font-size: 60px; margin-bottom: 26px; }
  .it { display: flex; align-items: center; gap: 24px; font-size: 42px; font-weight: 700; padding: 14px 0; }
  .box { width: 58px; height: 58px; border-radius: 16px; border: 4px solid #d8cfbf; display: grid; place-items: center; flex: 0 0 auto; }
  .box svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 3.2; }
  .spin { width: 58px; height: 58px; border-radius: 50%; border: 6px solid #e8dfcf; border-top-color: #d9773b; flex: 0 0 auto; }
  #bar { height: 16px; border-radius: 99px; background: #eee6d8; margin-top: 26px; overflow: hidden; }
  #fill { height: 100%; width: 0; }
</style></head>
<body><div id="bgw"></div><div id="c"><div id="title"></div><div id="list"></div><div id="bar"><div id="fill"></div></div></div>
<script type="module">
import motion from '/lib/runtime.js';
const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;
const accent = p.accent || '#1faa59';
if (p.mode === 'full') document.getElementById('bgw').outerHTML = '<div class="warm-bg"></div><div class="blinds"></div>';
document.getElementById('title').textContent = p.title || 'Editando seu vídeo…';
const defaults = ['ouvindo cada palavra', 'cortando pausas', 'melhor tomada', 'legenda', 'zoom', 'efeito sonoro', 'trilha'];
const raw = p.items && p.items.length ? p.items : defaults.map((x) => ({ text: x }));
const items = raw.map((it, i) => ({ ...it, at: typeof it.at === 'number' ? it.at : 0.4 + i * ((D - 1.2) / raw.length) }));
const list = document.getElementById('list');
let check = '';
motion.waitFor(motion.icon('check').then((s) => (check = s)));
const rows = items.map((it) => { const el = document.createElement('div'); el.className = 'it';
  el.innerHTML = `<div class="st"></div><div>${it.text}</div>`; list.appendChild(el); return { el, it }; });
const c = document.getElementById('c');
motion.onFrame((t) => {
  const k = motion.inOut(t, 0, D, 0.45, 0.3, 'outBack');
  c.style.top = (p.y ?? H * 0.22) + 'px';
  c.style.transform = `translateX(-50%) translateY(${(1 - k) * 60}px)`;
  c.style.opacity = Math.min(1, k * 1.5);
  let done = 0;
  rows.forEach(({ el, it }, i) => {
    const st = el.querySelector('.st');
    const next = rows[i + 1] ? rows[i + 1].it.at : it.at + 0.6;
    if (t >= it.at) { done++; st.outerHTML = `<div class="box st" style="background:${accent};border-color:${accent}">${check}</div>`; }
    else if (t >= (rows[i - 1] ? rows[i - 1].it.at : 0)) st.outerHTML = '<div class="spin st" style="transform:rotate(' + (t * 400) + 'deg)"></div>';
    else st.outerHTML = '<div class="box st"></div>';
    el.style.opacity = t >= it.at ? 1 : 0.55;
  });
  const f = document.getElementById('fill'); f.style.background = accent; f.style.width = (100 * done / rows.length) + '%';
});
</script></body></html>
