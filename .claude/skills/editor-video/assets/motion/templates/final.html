<!doctype html>
<!-- FINAL (layer: full): tela final de CTA — fundo roxo escuro com luz, rótulo ("COMENTA"), palavra-chave gigante em
     degradê ("EDIT PRO", quebra em 2 linhas se precisar), setas/chevrons descendo e cartão de perfil (foto ou
     iniciais, nome, site).
     params: rotulo ("COMENTA"), palavra ("EDIT PRO"), nome, site, foto (arquivo, opcional), cores: [c1, c2],
             perfil_at (s; padrão 45% da duração), fundo (cor base, padrão "#0E0820") -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lib/base.css">
<style>
  #bg { position: absolute; inset: 0; }
  #glow { position: absolute; left: 50%; top: 40%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; }
  #wrap { position: absolute; left: 60px; right: 150px; top: 330px; display: flex; flex-direction: column; align-items: center; }
  #rot { font-weight: 900; font-size: 74px; letter-spacing: 6px; color: #f2ecff; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #kw { display: flex; flex-direction: column; align-items: center; }
  .kl { font-weight: 900; line-height: .92; letter-spacing: -2px; color: transparent; -webkit-background-clip: text; background-clip: text;
        white-space: nowrap; filter: drop-shadow(0 10px 40px rgba(124,92,255,.45)); }
  #card { position: absolute; left: 50%; width: 620px; margin-left: -355px; display: flex; flex-direction: column; align-items: center; gap: 10px;
          padding: 36px 40px 34px; border-radius: 44px; }
  .kl span { display: inline-block; color: transparent; -webkit-background-clip: text; background-clip: text; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); }
  #pic { width: 150px; height: 150px; border-radius: 26px; overflow: hidden; display: grid; place-items: center;
         font-weight: 900; font-size: 60px; color: #fff; border: 4px solid rgba(255,255,255,.3); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  #pic img { width: 100%; height: 100%; object-fit: cover; }
  #nome { font-weight: 800; font-size: 54px; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #site { font-weight: 600; font-size: 34px; color: rgba(230,220,255,.8); }
  #chev { position: absolute; left: 60px; right: 150px; display: flex; flex-direction: column; align-items: center; }
  #chev svg { width: 110px; height: 60px; margin-top: -18px; }
</style></head>
<body><div id="bg"></div><div id="glow"></div>
<div id="wrap"><div id="rot"></div><div id="kw"></div></div>
<div class="orb" id="o1"></div><div class="orb" id="o2"></div>
<div id="card" class="ds-card ds-dark"><div id="pic"></div><div id="nome"></div><div id="site"></div></div>
<div id="chev"></div>
<script type="module">
import motion from '/lib/runtime.js';
const p = motion.params, W = motion.w, H = motion.h, D = motion.duration;
const [c1, c2] = p.cores || ['#B794FF', '#FF7AA8'];
const base = p.fundo || '#0E0820';
document.getElementById('bg').style.background = `radial-gradient(ellipse at 50% 35%, #2a1550 0%, ${base} 70%)`;
document.getElementById('glow').style.background = `radial-gradient(closest-side, ${c1}33, transparent)`;
const rot = document.getElementById('rot'), kw = document.getElementById('kw');
rot.textContent = p.rotulo ?? 'COMENTA';
const palavra = String(p.palavra || 'EDIT PRO').toUpperCase();
const maxW = W - 230;
// uma linha se couber grande; senão quebra em palavras (até 3 linhas); mede depois das fontes
const parts = palavra.split(/\s+/);
const tryLines = (arr, size) => { kw.innerHTML = ''; return arr.map((txt) => {
  const d = document.createElement('div'); d.className = 'kl'; d.textContent = txt; d.style.fontSize = size + 'px';
  d.style.backgroundImage = `linear-gradient(180deg, ${c1} 10%, ${c2} 100%)`; kw.appendChild(d); return d; }); };
let size = 300, lines = tryLines([palavra], size);
motion.waitFor(document.fonts.ready.then(() => {
  size = 300; lines = tryLines([palavra], size);
  if (lines[0].offsetWidth > maxW && parts.length > 1) { size = 320; lines = tryLines(parts.slice(0, 3), size); }
  while (Math.max(...lines.map((l) => l.offsetWidth)) > maxW && size > 90) { size -= 10; lines.forEach((l) => { l.style.fontSize = size + 'px'; }); }
  lines.forEach((l) => { l.letters = motion.split(l, 'chars');
    l.letters.forEach((c) => { c.style.backgroundImage = `linear-gradient(180deg, ${c1} 10%, ${c2} 100%)`; }); l.style.backgroundImage = 'none'; });
}));
const o1 = document.getElementById('o1'), o2 = document.getElementById('o2');
Object.assign(o1.style, { width: '700px', height: '700px', background: c1, opacity: .28 });
Object.assign(o2.style, { width: '600px', height: '600px', background: c2, opacity: .22 });
const card = document.getElementById('card'), pic = document.getElementById('pic');
document.getElementById('nome').textContent = p.nome || '';
document.getElementById('site').textContent = p.site || '';
if (p.foto) {
  const im = document.createElement('img'); pic.appendChild(im);
  motion.waitFor(new Promise((r) => { im.onload = r; im.onerror = r; im.src = p.foto; }));
} else {
  pic.textContent = String(p.nome || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  pic.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
}
if (!p.nome && !p.site && !p.foto) card.style.display = 'none';
const chev = document.getElementById('chev');
for (let i = 0; i < 3; i++) chev.insertAdjacentHTML('beforeend',
  `<svg viewBox="0 0 110 60"><path d="M10 10 L55 50 L100 10" fill="none" stroke="${c1}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const chevs = [...chev.querySelectorAll('svg')];
const perfilAt = typeof p.perfil_at === 'number' ? p.perfil_at : D * 0.45;
const wrapBottom = () => document.getElementById('wrap').getBoundingClientRect().bottom;
motion.onFrame((t) => {
  const kin = motion.prog(t, 0, 0.4, 'outCubic');
  // fundo vivo: luz respira e duas manchas de cor passeiam devagar
  const g = document.getElementById('glow');
  g.style.transform = `scale(${0.85 + 0.15 * kin + 0.04 * Math.sin(t * 1.3)})`; g.style.opacity = kin;
  o1.style.left = (120 + 160 * Math.sin(t * 0.5)) + 'px'; o1.style.top = (380 + 120 * Math.cos(t * 0.4)) + 'px';
  o2.style.left = (420 + 140 * Math.cos(t * 0.45)) + 'px'; o2.style.top = (900 + 140 * Math.sin(t * 0.55)) + 'px';
  motion.appear(rot, t, 0.05, { from: 'down', dist: 40, dur: 0.5, bounce: 0.3, out: 0, blur: 12 });
  rot.style.letterSpacing = (6 + (1 - motion.clamp(motion.spring(t, 0.05, { dur: 0.6, bounce: 0 }))) * 30) + 'px';
  const pk = motion.spring(t, perfilAt, { dur: 0.6, bounce: 0.3 });
  lines.forEach((l, i) => {
    l.style.transform = `scale(${1 + 0.012 * Math.sin(t * 2 + i)})`;
    l.style.filter = `drop-shadow(0 10px 40px rgba(124,92,255,.45)) brightness(${1 - 0.45 * motion.clamp(pk)})`;
    (l.letters || []).forEach((c, j) => {
      const at = 0.18 + i * 0.12 + j * 0.035;
      const k = motion.spring(t, at, { dur: 0.55, bounce: 0.3 }), kp = motion.spring(t - 1 / motion.fps, at, { dur: 0.55, bounce: 0.3 });
      const blur = Math.min(14, Math.abs(k - kp) * motion.fps * 2) + (k < 0.04 ? 12 : 0);
      c.style.opacity = motion.clamp(k * 2.4);
      c.style.transform = `translateY(${(1 - k) * 90}px) scale(${1.3 - 0.3 * k})`;
      c.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
    });
  });
  // perfil sobe por cima da palavra (que esmaece um pouco), como na referência
  const wb = wrapBottom();
  card.style.top = (Math.min(wb - 60, H - 760)) + 'px';
  motion.appear(card, t, perfilAt, { from: 'up', dist: 80, scale0: 0.88, dur: 0.6, bounce: 0.3, out: 0, float: 4 });
  chev.style.top = (Math.min(wb + 360, H - 470)) + 'px';
  chevs.forEach((c, i) => { const ph = (t * 1.6 - i * 0.22) % 1; c.style.opacity = Math.max(0, Math.sin(ph * Math.PI)) * kin;
    c.style.transform = `translateY(${ph * 14}px)`; });
});
</script></body></html>
